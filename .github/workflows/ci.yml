name: Validate Go platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/build
      - run: go build -o build/deploy-check ./cmd/deploy
      - run: go build -o build/infra-check ./infra
      - if: runner.os == 'Linux'
        run: go test -race ./internal/...
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lambda-arm64
          path: build/lambda.zip
